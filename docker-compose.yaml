services:
  station:
    ports:
      - "8000:8000"
    build: .
    env_file:
      - .env
    depends_on:
      - db
    command: >
      sh -c "python manage.py load_db &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16.0-alpine3.17
    restart: unless-stopped
    volumes:
      - db_data:$PGDATA
    env_file:
      - .env
    ports:
      - "5432:5432"
volumes:
  db_data:
